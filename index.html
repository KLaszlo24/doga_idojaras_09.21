<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>doga_idojaras</title>
  </head>
  <body class="bg-dark">
    <header class="bg-danger mb-4">
      <div class="container-fluid">
        <h1 class="text-center mb-0">Időjárási adatok</h1>
      </div>
    </header>

    <main class="container-fluid">
      <div class="table-responsive mb-4">
        <table class="table table-bordered">
          <thead class="table-warning">
            <tr>
              <th>Nap</th>
              <th>Hőmérséklet</th>
            </tr>
          </thead>

          <tbody id="content"></tbody>
        </table>
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <h2 class="card-title mb-3">Adat felvételek</h2>

          <form id="ujAdatForm">
            <div class="mb-3">
              <label for="temperature" class="form-label">Hőmérséklet</label>
              <input type="number" id="temperature" class="form-control"/>
            </div>
            <button type="submit" class="btn btn-warning">Hozzáadás</button>
          </form>
        </div>
      </div>

      <div class="mb-4">
        <button id="exportButton" type="button" class="btn btn-success mb-3">Export</button>
        <textarea id="export" class="form-control" rows="10" readonly></textarea>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
